[workspace]
members = [
    "crates/chainlink_core",
    "crates/chainlink_input",
    "crates/chainlink_scene",
    "crates/chainlink_render",
    "crates/chainlink_engine",
    "examples/pong",
]
resolver = "2"

[workspace.package]
version      = "0.1.0"
edition      = "2021"
authors      = ["Chainlink Game Engine Contributors"]
license      = "MIT"
repository   = "https://github.com/777cc/chainlink"
description  = "Chainlink Game Engine — a Godot-inspired engine with a pure-Rust core"

[workspace.dependencies]
# Internal crates
chainlink_core   = { path = "crates/chainlink_core" }
chainlink_input  = { path = "crates/chainlink_input" }
chainlink_scene  = { path = "crates/chainlink_scene" }
chainlink_render = { path = "crates/chainlink_render" }
chainlink_engine = { path = "crates/chainlink_engine" }

# Math
glam = "0.27"

# GPU / windowing
winit       = "0.29"
wgpu        = "0.19"
bytemuck    = { version = "1", features = ["derive"] }
pollster    = "0.3"

# Data structures
slotmap = "1"

# Logging
log        = "0.4"
env_logger = "0.10"

# Async helper (for wgpu init)
futures = { version = "0.3", default-features = false, features = ["executor"] }
