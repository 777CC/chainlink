[workspace]
members = [
    "crates/cl_core",
    "crates/cl_input",
    "crates/cl_scene",
    "crates/cl_render",
    "crates/cl_engine",
    "crates/cl_servers",
    "crates/cl_platform",
    "examples/pong",
    "examples/platformer",
]
resolver = "2"

[workspace.package]
version      = "0.1.0"
edition      = "2021"
authors      = ["Chainlink Game Engine Contributors"]
license      = "MIT"
repository   = "https://github.com/777cc/chainlink"
description  = "Chainlink Game Engine — a Godot-inspired engine with a pure-Rust core"

[workspace.dependencies]
# Internal crates
cl_core     = { path = "crates/cl_core" }
cl_input    = { path = "crates/cl_input" }
cl_scene    = { path = "crates/cl_scene" }
cl_render   = { path = "crates/cl_render" }
cl_engine   = { path = "crates/cl_engine" }
cl_servers  = { path = "crates/cl_servers" }
cl_platform = { path = "crates/cl_platform" }

# Math
glam = "0.27"

# GPU / windowing
winit       = "0.29"
wgpu        = "0.19"
bytemuck    = { version = "1", features = ["derive"] }
pollster    = "0.3"

# Data structures
slotmap = "1"

# Logging
log        = "0.4"
env_logger = "0.10"

# Async helper (for wgpu init)
futures = { version = "0.3", default-features = false, features = ["executor"] }

# Physics
rapier2d = { version = "0.22", features = ["default"] }

# Audio
rodio = { version = "0.19", default-features = false, features = ["wav", "vorbis"] }
